<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result Portal - Maknazul 'Irfan Academy</title>
<link rel="icon" href="assets/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d3b82">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MIA Results">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash" role="dialog" aria-label="Welcome">
  <script>try{if(sessionStorage.getItem("mia_welcomed")){document.getElementById("splash").remove()}}catch(e){}</script>
  <div class="sp-card">
    <img src="assets/logo.png" alt="Maknazul 'Irfan Academy logo">
    <p class="sp-small">Welcome to</p>
    <h1>MAKNAZUL 'IRFAN ACADEMY</h1>
    <p class="sp-sub">Student Result Portal</p>
    <p class="sp-motto">Know Me Before You Worship Me</p>
    <button id="spgo">Continue</button>
    <div class="sp-bar"><i></i></div>
  </div>
</div>
<header class="top">
  <a class="brand" href="#/"><img src="assets/logo.png" alt=""><span><b>MAKNAZUL 'IRFAN ACADEMY</b><small>Student Result Portal</small></span></a>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<footer class="foot">© Maknazul 'Irfan Academy · Know Me Before You Worship Me</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/calc.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
<script>
(function(){var s=document.getElementById("splash");if(!s)return;
function go(){if(!s.parentNode)return;try{sessionStorage.setItem("mia_welcomed","1")}catch(e){}s.classList.add("sp-out");setTimeout(function(){s.remove()},450)}
document.getElementById("spgo").onclick=go;s.onclick=go;setTimeout(go,3800)})();
</script>
</body>
</html>
